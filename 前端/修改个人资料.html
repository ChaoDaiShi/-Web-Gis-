<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>修改个人资料</title>
    <link rel="stylesheet" href="./样式/修改个人资料.css">
</head>

<body>
    <div class="topbar">
        <div class="topbar-title">校园失物招领与位置追踪系统</div>
        <div class="topbar-user">管</div>
    </div>

    <div class="container">
        <div class="action-bar">
            <button class="btn" id="backProfileBtn">返回个人中心</button>
            <button class="btn btn-primary" id="backHomeBtn">返回主页</button>
        </div>

        <div class="content-card">
            <h1 class="card-title">修改个人资料</h1>

            <div class="success-msg" id="successMsg">个人资料修改成功！</div>

            <h2 class="section-title">基础设置</h2>

            <div class="avatar-section">
                <div class="avatar">👤</div>
                <div class="avatar-info">
                    <h3>个人头像</h3>
                    <p>支持 JPG、PNG 格式，文件大小不超过 2MB</p>
                    <button class="btn" id="changeAvatarBtn">点击修改头像</button>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="username">用户名</label>
                    <input type="text" id="username" placeholder="请输入用户名">
                </div>

                <div class="form-group">
                    <label for="signature">用户签名</label>
                    <input type="text" id="signature" placeholder="请输入个性签名">
                </div>
            </div>

            <div class="form-group">
                <label for="bio">个人介绍</label>
                <textarea id="bio" placeholder="介绍一下自己吧..."></textarea>
            </div>

            <div class="more-settings">
                <h2 class="section-title">更多设置</h2>

                <div class="form-group">
                    <label for="email">电子邮箱</label>
                    <input type="email" id="email" placeholder="请输入电子邮箱">
                </div>

                <div class="form-group">
                    <label for="verifyCode">验证码</label>
                    <div class="input-group">
                        <input type="text" id="verifyCode" placeholder="请输入验证码" maxlength="6">
                        <button class="btn" id="sendCodeBtn">获取验证码</button>
                    </div>
                    <p class="hint">验证码将发送到您的绑定手机</p>
                </div>
            </div>

            <div class="button-group">
                <button class="btn" id="cancelBtn">取消</button>
                <button class="btn btn-primary" id="confirmBtn">确认修改</button>
            </div>
        </div>
    </div>

    <script src="./脚本/修改个人资料.js"></script>
</body>

</html>
