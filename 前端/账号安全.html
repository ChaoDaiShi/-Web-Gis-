<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>账号安全中心</title>
    <link rel="stylesheet" href="./样式/账号安全.css">
</head>

<body>
    <div class="topbar">
        <div class="topbar-title">校园失物招领与位置追踪系统</div>
        <div class="topbar-user">管</div>
    </div>

    <div class="container">
        <div class="action-bar">
            <button class="btn" id="backProfileBtn">返回个人中心</button>
            <button class="btn btn-primary" id="backHomeBtn">返回主页</button>
        </div>

        <div class="content-card">
            <div class="card-header">
                <h1 class="card-title">账号安全中心</h1>
                <p class="card-desc">绑定手机与修改密码已合并到同一页，统一入口，操作更直观。</p>
            </div>

            <div class="tabs">
                <button class="tab active" id="tabBind">绑定手机</button>
                <button class="tab" id="tabPassword">修改密码</button>
            </div>

            <div class="panel active" id="panelBind">
                <div class="success-msg" id="bindSuccess">手机号绑定成功！</div>
                <div class="error-msg" id="bindError">绑定失败，请检查输入信息。</div>

                <div class="form-group">
                    <label for="phoneInput">手机号</label>
                    <input type="tel" id="phoneInput" placeholder="请输入手机号" maxlength="11">
                </div>

                <div class="form-group">
                    <label for="smsInput">短信验证码</label>
                    <div class="input-group">
                        <input type="text" id="smsInput" placeholder="请输入验证码" maxlength="6">
                        <button class="btn" id="sendSmsBtn">获取验证码</button>
                    </div>
                </div>

                <button class="btn btn-primary submit-btn" id="bindSubmitBtn">确认绑定</button>

                <div class="hint">
                    提示：绑定成功后可用于找回密码和异常登录提醒。
                </div>
            </div>

            <div class="panel" id="panelPassword">
                <div class="success-msg" id="pwdSuccess">密码修改成功！</div>
                <div class="error-msg" id="pwdError">修改失败，请检查输入信息。</div>

                <div class="form-group">
                    <label for="oldPwd">当前密码</label>
                    <input type="password" id="oldPwd" placeholder="请输入当前密码">
                </div>

                <div class="form-group">
                    <label for="newPwd">新密码</label>
                    <input type="password" id="newPwd" placeholder="请输入新密码（8位及以上）">
                </div>

                <div class="form-group">
                    <label for="confirmPwd">确认新密码</label>
                    <input type="password" id="confirmPwd" placeholder="请再次输入新密码">
                </div>

                <button class="btn btn-primary submit-btn" id="pwdSubmitBtn">确认修改</button>

                <div class="hint">
                    建议：使用字母+数字+符号组合，提升账号安全等级。
                </div>
            </div>
        </div>
    </div>

    <script src="./脚本/账号安全.js"></script>
</body>

</html>
