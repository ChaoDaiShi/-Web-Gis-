<!DOCTYPE html>
<html>
  <head>
    <title>登录界面（初版）</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>

    <link href="resources/css/axure_rp_page.css" type="text/css" rel="stylesheet"/>
    <link href="data/styles.css" type="text/css" rel="stylesheet"/>
    <link href="files/登录界面（初版）/styles.css" type="text/css" rel="stylesheet"/>
    <script src="resources/scripts/jquery-3.7.1.min.js"></script>

    <script src="resources/scripts/axure/variables.js"></script>
    <script src="resources/scripts/axure/drag.js"></script>
    <script src="resources/scripts/axure/move.js"></script>
    <script src="resources/scripts/axure/visibility.js"></script>
    <script src="resources/scripts/axure/style.js"></script>
    <script src="resources/scripts/axure/adaptive.js"></script>
    <script src="resources/scripts/axure/tree.js"></script>
    <script src="resources/scripts/axure/init.temp.js"></script>
    <script src="resources/scripts/axure/legacy.js"></script>
    <script src="resources/scripts/axure/viewer.js"></script>

    <script src="data/document.js"></script>
    <script src="files/登录界面（初版）/data.js"></script>
    <script type="text/javascript">
      $axure.utils.getTransparentGifPath = function() { return 'resources/images/transparent.gif'; };
      $axure.utils.getOtherPath = function() { return 'resources/Other.html'; };
      $axure.utils.getReloadPath = function() { return 'resources/reload.html'; };
    </script>
    <style>
      .topbar {
        width: 100%;
        height: 60px;
        background: #33ccff;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 16px;
      }
      .topbar-title {
        margin: 0;
        font-size: clamp(20px, 2.2vw, 34px);
        line-height: 1;
        font-family: "Microsoft YaHei", "Segoe UI", Arial, sans-serif;
      }
      .topbar-user {
        width: 42px;
        height: 42px;
        border-radius: 999px;
        background: #111827;
        color: #fff;
        display: grid;
        place-items: center;
        font-size: 18px;
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <h1 class="topbar-title">校园失物招领与位置追踪系统</h1>
      <div class="topbar-user" title="用户">人</div>
    </header>
    <div id="base" class="">

      <!-- Unnamed (基础底板) -->

      <!-- 底板 (矩形) -->
      <div id="u43" class="ax_default box_1" data-label="底板">
        <div id="u43_div" class=""></div>
        <div id="u43_text" class="text " style="display:none; visibility: hidden">
          <p></p>
        </div>
      </div>
      <div id="u42" style="display:none; visibility:hidden;"></div>

      <!-- Unnamed (组合) -->
      <div id="u44" class="ax_default" data-left="460" data-top="135" data-width="520" data-height="600" layer-opacity="1">

        <!-- 登录框 (矩形) -->
        <div id="u45" class="ax_default box_1" data-label="登录框">
          <div id="u45_div" class=""></div>
          <div id="u45_text" class="text " style="display:none; visibility: hidden">
            <p></p>
          </div>
        </div>

        <!-- 登录界面 (矩形) -->
        <div id="u46" class="ax_default label" data-label="登录界面">
          <div id="u46_div" class=""></div>
          <div id="u46_text" class="text ">
            <p><span>登录界面</span></p>
          </div>
        </div>

        <!-- Unnamed (矩形) -->
        <div id="u47" class="ax_default box_2">
          <div id="u47_div" class=""></div>
          <div id="u47_text" class="text " style="display:none; visibility: hidden">
            <p></p>
          </div>
        </div>

        <!-- 输入账号名 (文本框) -->
        <div id="u48" class="ax_default text_field" data-label="输入账号名">
          <div id="u48_div" class=""></div>
          <input id="u48_input" type="email" value="" class="u48_input"/>
        </div>

        <!-- 输入密码 (文本框) -->
        <div id="u49" class="ax_default text_field" data-label="输入密码">
          <div id="u49_div" class=""></div>
          <input id="u49_input" type="password" value="" class="u49_input"/>
        </div>

        <!-- 登录按钮 (矩形) -->
        <div id="u50" class="ax_default html_button" data-label="登录按钮">
          <div id="u50_div" class=""></div>
          <div id="u50_text" class="text ">
            <p><span>登录</span></p>
          </div>
        </div>
      </div>

      <!-- Unnamed (矩形) -->
      <div id="u51" class="ax_default label">
        <div id="u51_div" class=""></div>
        <div id="u51_text" class="text ">
          <p><span>若没有账户，则默认注册账号</span></p>
        </div>
      </div>
    </div>
    <script src="resources/scripts/axure/ios.js"></script>
  </body>
</html>
