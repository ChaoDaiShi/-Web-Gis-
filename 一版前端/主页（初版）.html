<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>主页（初版）</title>
    <style>
      :root {
        --topbar-height: 60px;
        --list-width: 250px;
        --bg: #f3f4f6;
        --yellow: #d1d100;
        --brand: #33ccff;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Microsoft YaHei", "Segoe UI", Arial, sans-serif;
        background: var(--bg);
        color: #1f2937;
        overflow: hidden;
      }

      .topbar {
        height: var(--topbar-height);
        background: var(--brand);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 16px;
      }
      .topbar-title {
        margin: 0;
        font-size: clamp(20px, 2.2vw, 34px);
        line-height: 1;
      }
      .topbar-actions {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .search-wrap input {
        width: 220px;
        height: 34px;
        border: 1px solid #9ca3af;
        border-radius: 6px;
        padding: 0 10px;
        background: #fff;
      }
      .avatar-btn {
        width: 42px;
        height: 42px;
        border-radius: 999px;
        border: 0;
        background: #111827;
        color: #fff;
        cursor: pointer;
        font-size: 18px;
        display: grid;
        place-items: center;
      }

      .app {
        position: relative;
        display: flex;
        width: 100vw;
        height: calc(100vh - var(--topbar-height));
      }

      .list-panel {
        width: var(--list-width);
        background: var(--yellow);
        border-right: 1px solid #9ca3af;
        overflow: auto;
        transition: width 0.25s ease;
      }
      .list-panel.expanded {
        width: 50vw;
      }
      .list-header {
        position: sticky;
        top: 0;
        background: #b5b500;
        color: #111827;
        padding: 10px 12px;
        font-weight: 700;
      }
      .list-tip {
        font-size: 12px;
        opacity: 0.9;
        margin-top: 4px;
        font-weight: 400;
      }
      .item-list {
        list-style: none;
        margin: 0;
        padding: 8px;
      }
      .item-card {
        background: rgba(255, 255, 255, 0.9);
        border: 1px solid #9ca3af;
        border-radius: 8px;
        padding: 8px;
        margin-bottom: 8px;
        cursor: pointer;
      }
      .item-card:hover { background: #fff; }
      .item-card-title { font-weight: 700; margin-bottom: 4px; }
      .item-card-detail {
        display: none;
        font-size: 13px;
        color: #374151;
        line-height: 1.5;
      }
      .item-card.expanded .item-card-detail { display: block; }

      .map-panel {
        position: relative;
        flex: 1;
        background: #ffffff;
        overflow: hidden;
      }
      @keyframes pulse {
        from { transform: rotate(-45deg) scale(1); }
        to { transform: rotate(-45deg) scale(1.12); }
      }
      @keyframes markerPulse {
        0% {
          transform: translate(-50%, -100%) scale(1);
          box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.35);
        }
        70% {
          transform: translate(-50%, -100%) scale(1.08);
          box-shadow: 0 0 0 16px rgba(245, 158, 11, 0);
        }
        100% {
          transform: translate(-50%, -100%) scale(1);
          box-shadow: 0 0 0 0 rgba(245, 158, 11, 0);
        }
      }
      @keyframes markerBounce {
        0%, 100% { transform: translate(-50%, -100%) translateY(0); }
        50% { transform: translate(-50%, -100%) translateY(-8px); }
      }
      .marker-wrap {
        position: relative;
        width: 34px;
        height: 48px;
      }
      .marker-core {
        position: absolute;
        left: 50%;
        top: 100%;
        width: 28px;
        height: 28px;
        border-radius: 50% 50% 50% 0;
        transform: translate(-50%, -100%) rotate(-45deg);
        background: linear-gradient(135deg, #f97316 0%, #ef4444 70%);
        border: 2px solid #fff;
        box-shadow: 0 6px 14px rgba(0, 0, 0, 0.28);
      }
      .marker-core::after {
        content: "";
        position: absolute;
        left: 50%;
        top: 50%;
        width: 11px;
        height: 11px;
        border-radius: 50%;
        background: #fff;
        transform: translate(-50%, -50%) rotate(45deg);
      }
      .marker-wave {
        position: absolute;
        left: 50%;
        top: 100%;
        width: 30px;
        height: 30px;
        border-radius: 999px;
        transform: translate(-50%, -100%);
        animation: markerPulse 1.8s ease-out infinite;
      }
      .marker-label {
        position: absolute;
        left: 50%;
        top: -8px;
        transform: translate(-50%, -100%);
        min-width: 62px;
        max-width: 120px;
        text-align: center;
        font-size: 12px;
        line-height: 1.2;
        color: #fff;
        background: rgba(17, 24, 39, 0.88);
        border-radius: 999px;
        padding: 3px 8px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .marker-wrap.highlight .marker-core {
        background: linear-gradient(135deg, #facc15 0%, #f97316 58%, #dc2626 100%);
        box-shadow: 0 10px 18px rgba(239, 68, 68, 0.42);
        animation: markerBounce 1s ease-in-out infinite;
      }
      .marker-wrap.highlight .marker-wave {
        width: 40px;
        height: 40px;
        animation-duration: 1.1s;
      }
      .marker-wrap.highlight .marker-label {
        background: #ef4444;
      }

      .side-toggle {
        position: absolute;
        left: calc(var(--list-width) - 14px);
        top: 50%;
        transform: translateY(-50%);
        width: 28px;
        height: 52px;
        border: 0;
        border-radius: 6px;
        background: #111827;
        color: #fff;
        cursor: pointer;
        z-index: 6;
      }
      .side-toggle.right-mode {
        left: 10px;
      }
      .side-toggle.hidden { display: none; }

      .modal-mask {
        position: fixed;
        inset: 0;
        display: none;
        background: rgba(0, 0, 0, 0.35);
        align-items: center;
        justify-content: center;
        z-index: 100;
      }
      .modal {
        width: min(540px, 92vw);
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 18px 40px rgba(0,0,0,0.22);
        padding: 16px;
      }
      .modal h3 { margin: 0 0 12px; }
      .form-row { margin-bottom: 10px; }
      .form-row label { display: block; margin-bottom: 4px; font-size: 14px; }
      .form-row input,
      .form-row textarea {
        width: 100%;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        padding: 8px;
        font-size: 14px;
      }
      .form-row textarea { min-height: 84px; resize: vertical; }
      .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 12px;
      }
      .btn {
        border: 1px solid #9ca3af;
        border-radius: 8px;
        padding: 8px 14px;
        background: #fff;
        cursor: pointer;
      }
      .btn.primary {
        background: #2563eb;
        color: #fff;
        border-color: #2563eb;
      }
      .status {
        position: absolute;
        right: 12px;
        bottom: 12px;
        background: rgba(17, 24, 39, 0.8);
        color: #fff;
        font-size: 12px;
        padding: 6px 8px;
        border-radius: 6px;
        z-index: 5;
      }

      .fullmap .list-panel { display: none; }
      .fullmap .map-panel { width: 100%; }
      .split .list-panel { width: 50vw; }

      @media (max-width: 900px) {
        :root { --list-width: 220px; }
        .search-wrap input { width: 160px; }
      }

      #mapContainer {
         width: 100%;
         height: 100%;
      }
    </style>
    <script src="https://webapi.amap.com/maps?v=2.0&key=49382949a3128467653e88aab0daa5c7"></script>
  </head>
  <body>
    <header class="topbar">
      <h1 class="topbar-title">校园失物招领与位置追踪系统</h1>
      <div class="topbar-actions">
        <div class="search-wrap">
          <input id="searchInput" type="text" placeholder="搜索标题/描述并定位" />
        </div>
        <button id="avatarBtn" class="avatar-btn" title="前往个人主页">管</button>
      </div>
    </header>

    <main id="app" class="app">
      <aside id="listPanel" class="list-panel" title="双击展开/收起详情">
        <div class="list-header">
          标记列表
          <div class="list-tip">双击黄色区域展开详细列表（50/50）</div>
        </div>
        <ul id="itemList" class="item-list"></ul>
      </aside>

      <button id="leftArrow" class="side-toggle" title="切入全图模式">◀</button>
      <button id="rightArrow" class="side-toggle right-mode hidden" title="返回分栏模式">▶</button>

      <section id="mapPanel" class="map-panel">
        <div id="mapContainer" style="width:100%;height:100%;"></div>
        <div id="status" class="status">点击地图任意位置可发布标记</div>
        <button id="toggle3D" style="
          position:absolute;
          top:12px;
          left:12px;
          z-index:10;
          padding:6px 10px;
          border-radius:6px;
          border:none;
          background:#111827;
          color:#fff;
          cursor:pointer;
        ">
          切换3D
        </button>
      </section>
    </main>

    <div id="publishMask" class="modal-mask">
      <div class="modal">
        <h3>发布信息</h3>
        <div class="form-row">
          <label for="pubTitle">标题</label>
          <input id="pubTitle" type="text" placeholder="请输入标题" />
        </div>
        <div class="form-row">
          <label for="pubDetail">描述</label>
          <textarea id="pubDetail" placeholder="请输入详细描述"></textarea>
        </div>
        <div class="form-row">
          <label for="pubPhone">联系方式</label>
          <input id="pubPhone" type="text" placeholder="请输入联系方式" />
        </div>
        <div class="modal-actions">
          <button id="pubCancel" class="btn" type="button">取消</button>
          <button id="pubSubmit" class="btn primary" type="button">发布</button>
        </div>
      </div>
    </div>

    <div id="detailMask" class="modal-mask">
      <div class="modal">
        <h3 id="detailTitle">详情</h3>
        <div id="detailBody" style="line-height:1.7;font-size:14px;"></div>
        <div class="modal-actions">
          <button id="detailClose" class="btn primary" type="button">关闭</button>
        </div>
      </div>
    </div>

    <script>
      const avatarBtn = document.getElementById("avatarBtn");
      const app = document.getElementById("app");
      const listPanel = document.getElementById("listPanel");
      const itemList = document.getElementById("itemList");
      const mapPanel = document.getElementById("mapPanel");

      const leftArrow = document.getElementById("leftArrow");
      const rightArrow = document.getElementById("rightArrow");
      const statusEl = document.getElementById("status");
      const searchInput = document.getElementById("searchInput");

      const publishMask = document.getElementById("publishMask");
      const pubTitle = document.getElementById("pubTitle");
      const pubDetail = document.getElementById("pubDetail");
      const pubPhone = document.getElementById("pubPhone");
      const pubCancel = document.getElementById("pubCancel");
      const pubSubmit = document.getElementById("pubSubmit");

      const detailMask = document.getElementById("detailMask");
      const detailTitle = document.getElementById("detailTitle");
      const detailBody = document.getElementById("detailBody");
      const detailClose = document.getElementById("detailClose");

      let is3D = true;
      let mode = "normal"; // normal | full | split
      let markers = [
          { id: "M001", lng: 103.988, lat: 30.582, title: "黑色水杯", detail: "图书馆拾取", phone: "13800001234", time: "2026-04-15 09:00" },
          { id: "M002", lng: 103.990, lat: 30.581, title: "校园卡", detail: "食堂门口", phone: "13900005678", time: "2026-04-15 11:20" },
          { id: "M003", lng: 103.986, lat: 30.583, title: "蓝牙耳机", detail: "教学楼A座", phone: "13600007890", time: "2026-04-15 13:08" }
        ];
      let pendingWorldPoint = null;
      let mapOffset = { x: -300, y: -180 };
      let highlightId = "";
      let map;
      let markerObjs = [];

      function initMap() {
          //校园范围（你提供的）
          const campusBounds = [
            [103.984435, 30.578367], // 西南角
            [103.992271, 30.58486]   // 东北角
          ];

          map = new AMap.Map("mapContainer", {
          zoom: 18,
          center: [103.9885, 30.5815],
          viewMode: '3D',   // 关键：开启3D模式
          pitch: 45,        // 倾斜角度（0-83）
          rotation: 0       // 可选：旋转角度
        });

          //遮罩（校园外变灰）
        //校园真实轮廓（先用近似版）
        const campusPath = [
          [103.984435, 30.578367],
          [103.986200, 30.579000],
          [103.988000, 30.579500],
          [103.990000, 30.580500],
          [103.992271, 30.584860],
          [103.989500, 30.584200],
          [103.987000, 30.583500],
          [103.985000, 30.582000]
        ];

        //校园外遮罩
        
        //限制地图只能在校园内

        //初始视角锁定校园
        const bounds = new AMap.Bounds(
          [103.984435, 30.578367],
          [103.992271, 30.58486]
        );

        map.setBounds(bounds);

        //限制缩放
        map.setZooms([16, 20]);

        //点击发布
        map.on("click", function (e) {
          const { lng, lat } = e.lnglat;
          openPublishModal(lng, lat);
        });
        }

       const toggleBtn = document.getElementById("toggle3D");

      toggleBtn.addEventListener("click", () => {
            is3D = !is3D;

            if (is3D) {
              map.setPitch(45);     // 开3D
              map.setRotation(0);
              toggleBtn.innerText = "切换2D";
              setStatus("已切换3D视图");
            } else {
              map.setPitch(0);      // 回2D
              map.setRotation(0);
              toggleBtn.innerText = "切换3D";
              setStatus("已切换2D视图");
            }
       });

      function updateLeftArrowPosition() {
        const appRect = app.getBoundingClientRect();
        const listRect = listPanel.getBoundingClientRect();
        const relativeLeft = listRect.right - appRect.left - 14;
        leftArrow.style.left = `${Math.max(6, relativeLeft)}px`;
      }

      function setStatus(msg) { statusEl.textContent = msg; }

      function centerToPoint(lng, lat) {
          map.setCenter([lng, lat]);
        }

      function switchMode(nextMode) {
        mode = nextMode;
        app.classList.remove("fullmap", "split");
        if (nextMode === "full") app.classList.add("fullmap");
        if (nextMode === "split") app.classList.add("split");

        if (nextMode === "full") {
          leftArrow.classList.add("hidden");
          rightArrow.classList.remove("hidden");
        } else {
          leftArrow.classList.remove("hidden");
          rightArrow.classList.add("hidden");
        }
        updateLeftArrowPosition();
        setTimeout(() => {
          map && map.resize();
        }, 300);

        map.setLayers([
          new AMap.TileLayer.Satellite(),
          new AMap.TileLayer.RoadNet()
        ]);

        map.setZooms([17, 22]);
      }

      function openPublishModal(lng, lat) {
          pendingWorldPoint = { lng, lat };
        pubTitle.value = "";
        pubDetail.value = "";
        pubPhone.value = "";
        publishMask.style.display = "flex";
      }

      function closePublishModal() {
        publishMask.style.display = "none";
      }

      function openDetail(marker) {
        detailTitle.textContent = marker.title;
        detailBody.innerHTML = `
          <div><strong>ID：</strong>${marker.id}</div>
          <div><strong>描述：</strong>${marker.detail}</div>
          <div><strong>联系方式：</strong>${marker.phone || "-"}</div>
          <div><strong>发布时间：</strong>${marker.time}</div>
        `;
        detailMask.style.display = "flex";
      }

      function closeDetail() {
        detailMask.style.display = "none";
      }

      function renderMarkers() {
          // 清空旧 marker
          markerObjs.forEach(m => m.setMap(null));
          markerObjs = [];

          markers.forEach((m) => {

            // 防止 NaN 直接跳过
            if (
              m.lng === undefined || m.lat === undefined ||
              isNaN(m.lng) || isNaN(m.lat)
            ) {
              console.warn("无效坐标:", m);
              return;
            }

            const isHighlight = highlightId && highlightId === m.id;
            const marker = new AMap.Marker({
              position: [Number(m.lng), Number(m.lat)],
              map: map,
              title: m.title,
              offset: new AMap.Pixel(-17, -48),
              content: `
                <div class="marker-wrap ${isHighlight ? "highlight" : ""}">
                  <div class="marker-wave"></div>
                  <div class="marker-core"></div>
                  <div class="marker-label">${m.title}</div>
                </div>
              `
            });

            marker.on("click", () => {
              highlightId = m.id;
              openDetail(m);
            });

            markerObjs.push(marker);
          });
        }

      function renderList() {
        itemList.innerHTML = "";
        markers.forEach((m) => {
          const li = document.createElement("li");
          li.className = "item-card";
          li.innerHTML = `
            <div class="item-card-title">${m.title}</div>
            <div>ID: ${m.id}</div>
            <div class="item-card-detail">
              <div>描述：${m.detail}</div>
              <div>联系方式：${m.phone || "-"}</div>
              <div>发布时间：${m.time}</div>
            </div>
          `;
          li.addEventListener("click", () => {
            highlightId = m.id;
            centerToPoint(m.lng, m.lat);
            renderMarkers();
            setStatus(`已定位到：${m.title}`);
          });
          li.addEventListener("dblclick", (e) => {
            e.stopPropagation();
            li.classList.toggle("expanded");
          });
          itemList.appendChild(li);
        });
      }

      function renderAll() {
        renderMarkers();
        renderList();
        updateLeftArrowPosition();
      }

      avatarBtn.addEventListener("click", () => {
        window.location.href = "./个人中心.html";
      });

      leftArrow.addEventListener("click", () => {
        switchMode("full");
        setStatus("已切换全图模式");
      });
      rightArrow.addEventListener("click", () => {
        switchMode("normal");
        setStatus("已返回分栏模式");
      });

      listPanel.addEventListener("dblclick", (e) => {
        if (mode === "full") return;
        if (e.target.closest(".item-card")) return;
        switchMode(mode === "split" ? "normal" : "split");
        setStatus(mode === "split" ? "列表已展开（50/50）" : "已恢复普通分栏");
      });


      pubCancel.addEventListener("click", closePublishModal);
      publishMask.addEventListener("click", (e) => { if (e.target === publishMask) closePublishModal(); });

      pubSubmit.addEventListener("click", () => {
        if (!pendingWorldPoint) return;
        const title = pubTitle.value.trim();
        const detail = pubDetail.value.trim();
        if (!title || !detail) {
          setStatus("标题和描述不能为空");
          return;
        }
        const id = "M" + String(Date.now()).slice(-5);
        markers.push({
          id,
          lng: pendingWorldPoint.lng,
          lat: pendingWorldPoint.lat,
          title,
          detail,
          phone: pubPhone.value.trim(),
          time: new Date().toLocaleString("zh-CN", { hour12: false })
        });
        highlightId = id;
        renderAll();
        closePublishModal();
        setStatus("发布成功，已生成新标记并写入列表");
      });

      detailClose.addEventListener("click", closeDetail);
      detailMask.addEventListener("click", (e) => { if (e.target === detailMask) closeDetail(); });

      searchInput.addEventListener("keydown", (e) => {
        if (e.key !== "Enter") return;
        const key = searchInput.value.trim().toLowerCase();
        if (!key) return;
        const hit = markers.find((m) => `${m.title} ${m.detail}`.toLowerCase().includes(key));
        if (!hit) {
          setStatus("未找到匹配标记");
          return;
        }
        highlightId = hit.id;
        centerToPoint(hit.lng, hit.lat);
        renderMarkers();
        setStatus(`已定位并高亮：${hit.title}`);
      });

      window.addEventListener("resize", () => {
        updateLeftArrowPosition();
      });

      // Keep arrow glued to split line even during width transition
      new ResizeObserver(() => {
        updateLeftArrowPosition();
      }).observe(listPanel);

      initMap();
      switchMode("normal");
      renderAll();
    </script>
  </body>
</html>
